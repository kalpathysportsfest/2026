<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KSF 2026 — Badminton Fixtures</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive badminton tournament fixtures for Kalpathy Sports Fest 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --court-deep: #030508;
  --court-mid: #0b1633;
  --court-line: #ffffff;

  --card: #080d18;

  --gold: #ff7a00;
  --gold-soft: rgba(255, 122, 0, 0.12);
  --gold-strong: #ff8a1a;

  --ink: #ffffff;
  --muted: #a7afbd;

  --hair: rgba(255, 255, 255, 0.10);
  --hair-strong: rgba(255, 255, 255, 0.20);

  --win: #ff7a00;
  --win-bg: rgba(255, 122, 0, 0.16);

  --bg: #030508;
  --surface: #080d18;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Source Sans 3', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  color-scheme: dark;
}
h1, h2, h3, .disp {
  font-family: 'Oswald', Impact, 'Arial Narrow', sans-serif;
  letter-spacing: .01em;
}
.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 16px 64px;
}
.hero {
  position: relative;
  overflow: hidden;
  background: #050605;
  border-bottom: 1px solid var(--hair);
  padding: 24px 16px 20px;
}
.hero-inner {
  max-width: 1180px;
  margin: 0 auto;
  position: relative;
}
.hero-brand {
  display: flex;
  align-items: center;
  gap: 20px;
}
.logo-wrap {
  width: 88px;
  height: 88px;
  flex: 0 0 88px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  background: rgba(255, 122, 0, 0.08);
  border: 1px solid rgba(255, 122, 0, 0.35);
  font-size: 42px;
  overflow: hidden;
  position: relative;
}

.ksf-logo {
  width: 126%;
  height: 126%;
  object-fit: contain;
  display: block;
}
.logo-fallback {
  font-size: 38px;
  line-height: 1;
}
.hero-copy {
  min-width: 0;
  flex: 1;
}
.kicker {
  font-size: 13px;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: .12em;
  font-weight: 600;
  margin: 0 0 4px;
}
.hero h1 {
  font-size: clamp(26px, 4vw, 38px);
  margin: 0 0 4px;
  font-weight: 700;
  line-height: 1.1;
  color: #ffffff;
}
.hero p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  max-width: 600px;
}
.hero-meta-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  font-size: 13px;
  flex-wrap: wrap;
}
.tourney-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--hair-strong);
  color: var(--muted);
}
.tourney-status-badge.is-live {
  background: rgba(239, 68, 68, 0.15);
  border-color: rgba(239, 68, 68, 0.4);
  color: #fca5a5;
}
.tourney-status-badge.is-live .pulse-dot {
  background: #ef4444;
  box-shadow: 0 0 8px #ef4444;
}
.meta-dot {
  color: var(--hair-strong);
}
.court-summary {
  color: var(--muted);
  font-size: 13px;
}
.pulse-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #4fae7d;
  box-shadow: 0 0 6px #4fae7d;
  animation: pulse 1.8s infinite;
}
@keyframes pulse {
  0% { opacity: 0.4; }
  50% { opacity: 1; }
  100% { opacity: 0.4; }
}

/* Match & Category status badges: Live, Upcoming, Completed */
.badge-status {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  line-height: 1.2;
}
.badge-live {
  background: rgba(239, 68, 68, 0.18);
  border: 1px solid rgba(239, 68, 68, 0.45);
  color: #fca5a5;
}
.badge-live .pulse-dot {
  background: #ef4444;
  box-shadow: 0 0 6px #ef4444;
}
.badge-completed {
  background: rgba(79, 174, 125, 0.15);
  border: 1px solid rgba(79, 174, 125, 0.35);
  color: #79dca6;
}
.badge-upcoming {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: var(--muted);
}
.badge-inprogress {
  background: rgba(242, 194, 48, 0.12);
  border: 1px solid rgba(242, 194, 48, 0.3);
  color: var(--gold);
}
.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 16px 16px 0;
  max-width: 1180px;
  margin: 0 auto;
  scrollbar-width: thin;
}
.tabs::-webkit-scrollbar { height: 5px; }
.tab {
  flex: 0 0 auto;
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid var(--hair-strong);
  background: var(--surface);
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  font-family: 'Source Sans 3', sans-serif;
  transition: all .15s ease;
}
.tab:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
}
.tab.active {
  background: var(--court-mid);
  border-color: #3b50ba;
  color: #fff;
  box-shadow: 0 2px 8px rgba(22, 32, 88, 0.5);
}
.cat {
  display: none;
  animation: fadein .25s ease;
}
.cat.active { display: block; }
@keyframes fadein {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.cat-head {
  padding: 22px 0 10px;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  border-bottom: 1px solid var(--hair);
}
.cat-head h2 {
  font-size: 24px;
  margin: 0;
  font-weight: 600;
  color: #fff;
}
.cat-sub {
  color: var(--muted);
  font-size: 14px;
  margin: 2px 0 0;
}
.chip {
  font-size: 12.5px;
  color: var(--gold);
  background: var(--gold-soft);
  border: 1px solid rgba(242, 194, 48, 0.3);
  padding: 4px 10px;
  border-radius: 6px;
  font-weight: 600;
}
details.rules {
  margin: 14px 0 6px;
  border: 1px solid var(--hair);
  border-radius: 10px;
  background: var(--surface);
}
details.rules summary {
  cursor: pointer;
  padding: 11px 14px;
  font-weight: 600;
  font-size: 14px;
  color: #fff;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
details.rules summary::-webkit-details-marker { display: none; }
details.rules summary:before {
  content: "+";
  display: inline-block;
  width: 16px;
  color: var(--gold);
  font-weight: 700;
}
details.rules[open] summary:before { content: "–"; }
details.rules .rulebody { padding: 0 16px 14px 38px; }
details.rules ul { margin: 6px 0; padding-left: 16px; }
details.rules li {
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.55;
  margin-bottom: 6px;
}
.round-scroll {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding: 18px 2px 10px;
  scroll-snap-type: x proximity;
}
.round-col {
  flex: 0 0 280px;
  scroll-snap-align: start;
}
.round-title {
  background: var(--gold-strong);
  color: #1a1503;
  font-size: 12.5px;
  text-transform: uppercase;
  letter-spacing: .09em;
  font-weight: 700;
  padding: 8px 12px;
  border-radius: 8px 8px 0 0;
  font-family: 'Oswald', sans-serif;
}
.round-body {
  border: 1px solid var(--hair);
  border-top: none;
  border-radius: 0 0 8px 8px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--surface);
  min-height: 8px;
}
.match {
  border: 1px solid var(--hair);
  border-radius: 8px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.02);
}
.m-id {
  font-size: 11px;
  color: var(--muted);
  padding: 6px 10px 4px;
  font-weight: 600;
  letter-spacing: .04em;
  display: flex;
  justify-content: space-between;
}
.side {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-top: 1px solid var(--hair);
  gap: 8px;
  transition: background .12s;
  pointer-events: none !important;
  user-select: none;
}
.side.win {
  background: var(--win-bg);
}
.side .nm-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  flex: 1;
}
.side .nm {
  font-size: 13.5px;
  line-height: 1.3;
  color: #fff;
}
.side.win .nm {
  color: #79dca6;
  font-weight: 700;
}
.side.placeholder .nm {
  color: var(--muted);
  font-style: italic;
}
.score-tag {
  font-family: 'Oswald', sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.08);
  color: #f6f3ea;
  margin-left: auto;
}
.side.win .score-tag {
  background: var(--win);
  color: #ffffff;
}
.tick {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--hair-strong);
  flex: 0 0 16px;
}
.side.win .tick {
  background: var(--win);
  border-color: var(--win);
  position: relative;
}
.side.win .tick:after {
  content: "";
  position: absolute;
  left: 4.5px;
  top: 2px;
  width: 4px;
  height: 8px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.bye-note {
  font-size: 11.5px;
  color: var(--gold);
  padding: 0 10px 8px;
}
.grp-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-top: 16px;
}
@media (max-width: 720px) {
  .grp-grid { grid-template-columns: 1fr; }
}
.grp-card {
  border: 1px solid var(--hair);
  border-radius: 10px;
  background: var(--surface);
  overflow: hidden;
}
.grp-card h3 {
  margin: 0;
  padding: 10px 14px;
  background: var(--gold-strong);
  color: #1a1503;
  font-size: 15px;
  font-weight: 700;
}
.team-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  font-size: 13.5px;
  border-top: 1px solid var(--hair);
  color: #fff;
}
.team-row .n {
  color: var(--gold);
  font-weight: 700;
  font-family: 'Oswald', sans-serif;
  width: 18px;
}
.rr-matches { padding: 6px 12px 12px; }
.rr-match {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-top: 1px solid var(--hair);
  font-size: 13px;
}
.rr-match:first-child { border-top: none; }
.rr-id {
  width: 70px;
  flex: 0 0 70px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
}
.rr-side {
  flex: 1;
  padding: 6px 8px;
  border-radius: 6px;
  line-height: 1.3;
}
.rr-side.win {
  background: var(--win-bg);
  color: #79dca6;
  font-weight: 700;
}
.vs { color: var(--muted); font-size: 11px; }
table.standings {
  width: 100%;
  border-collapse: collapse;
  margin-top: 6px;
  font-size: 12.8px;
}
table.standings th {
  text-align: left;
  font-weight: 600;
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .04em;
  padding: 6px 8px;
  border-bottom: 1px solid var(--hair-strong);
}
table.standings td {
  padding: 7px 8px;
  border-bottom: 1px solid var(--hair);
  color: #fff;
}
table.standings tr.rank1 td {
  background: var(--win-bg);
  font-weight: 700;
  color: #79dca6;
}
.champ-strip {
  margin-top: 18px;
  padding: 14px 16px;
  border: 1px dashed var(--hair-strong);
  border-radius: 10px;
  background: rgba(242, 194, 48, 0.08);
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  font-size: 14px;
}
.champ-strip b { color: var(--gold); }
footer {
  max-width: 1180px;
  margin: 30px auto 0;
  padding: 0 16px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-brand">
      <div class="logo-wrap">
        <img class="ksf-logo" src="./logo.png" alt="Kalpathy Sports Fest logo" onerror="this.onerror=null;this.style.display='none';var fb=this.parentElement.querySelector('.logo-fallback');if(fb)fb.style.display='block';">
        <span class="logo-fallback" style="display:none;">🏸</span>
      </div>

        <p class="kicker">Kalpathy Sports Fest · 2026</p>

        <div class="hero-meta-row">
          <span class="tourney-status-badge" id="global-status-badge">Upcoming · 20th Sept 2026</span>
          <span class="meta-dot">·</span>
          <span class="court-summary">3 Courts</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="tabs" id="tabs"></div>

<div class="wrap" id="catHost"></div>

<footer>
  <p>Kalpathy Sports Fest 2026 · Badminton Tournament Fixtures</p>
  <p style="opacity:0.6;font-size:11px;margin-top:4px;">Official tournament draws &amp; schedules</p>
</footer>

<script>
(function() {
  "use strict";

  var CATEGORY_FILES = [
    { id: "girls-singles", file: "girls-singles.json", name: "Girls Singles" },
    { id: "womens-singles", file: "womens-singles.json", name: "Women's Singles" },
    { id: "womens-doubles", file: "womens-doubles.json", name: "Women's Doubles" },
    { id: "boys-singles", file: "boys-singles.json", name: "Boys Singles" },
    { id: "boys-doubles", file: "boys-doubles.json", name: "Boys' Doubles" },
    { id: "mens-singles", file: "mens-singles.json", name: "Men's Singles" },
    { id: "mens-doubles", file: "mens-doubles.json", name: "Men's Doubles" }
  ];

  var GEN_SINGLES = [
    "Toss decides who serves first and choice of ends.",
    "Serves are underarm and diagonal, struck below waist height; server uses the right court on an even score, left on odd.",
    "Full singles court is in play; a shuttle on the line is in.",
    "A let replays the rally without penalty for accidental disturbances (shuttle caught in net, early serve, shuttle breaking apart).",
    "A rally is lost immediately for a shuttle landing out, failing to clear the net, touching a player or their clothing, a double hit, or obstructing an opponent.",
    "Umpire and organizer calls on faults or lets are final."
  ];

  var GEN_DOUBLES = [
    "Toss decides which team serves first and choice of ends.",
    "One serve per turn (no second serve); serves are underarm, diagonal, and below waist height.",
    "The full doubles court, including the wider sidelines and short service line, is in play.",
    "Serving side's service court follows their own score (even = right, odd = left); the receiving pair may stand in either box but can't swap until their side serves.",
    "A let replays the rally without penalty for accidental disturbances.",
    "A rally is lost immediately for a shuttle landing out, failing to clear the net, touching a player, a double hit, obstruction, or both partners touching the shuttle in succession.",
    "Umpire and organizer calls on faults or lets are final."
  ];

  var catDataMap = {};
  var activeCatId = "girls-singles";
  var lastSyncDate = null;

  function esc(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* Compute winner and scores for a match */
  function getMatchOutcome(m) {
    var hasScores = false;
    var sA = null, sB = null;
    var scoreLabelA = "", scoreLabelB = "";
    var winnerSide = null;

    if (m.scoreA !== null && m.scoreA !== undefined && m.scoreB !== null && m.scoreB !== undefined) {
      sA = parseInt(m.scoreA, 10);
      sB = parseInt(m.scoreB, 10);
      if (!isNaN(sA) && !isNaN(sB)) {
        hasScores = true;
        scoreLabelA = String(sA);
        scoreLabelB = String(sB);
        if (sA > sB) winnerSide = "A";
        else if (sB > sA) winnerSide = "B";
      }
    } else if (Array.isArray(m.sets) && m.sets.length > 0) {
      hasScores = true;
      var winsA = 0, winsB = 0;
      var partsA = [], partsB = [];
      m.sets.forEach(function(set) {
        if (Array.isArray(set) && set.length >= 2) {
          var pA = parseInt(set[0], 10) || 0;
          var pB = parseInt(set[1], 10) || 0;
          partsA.push(pA);
          partsB.push(pB);
          if (pA > pB) winsA++;
          else if (pB > pA) winsB++;
        }
      });
      scoreLabelA = partsA.join(", ");
      scoreLabelB = partsB.join(", ");
      if (winsA > winsB) winnerSide = "A";
      else if (winsB > winsA) winnerSide = "B";
    }

    if (m.winner) {
      winnerSide = m.winner.toUpperCase();
    }

    return {
      hasScores: hasScores || !!m.winner,
      sA: sA,
      sB: sB,
      scoreLabelA: scoreLabelA,
      scoreLabelB: scoreLabelB,
      winnerSide: winnerSide
    };
  }

  /* Resolve placeholder references (e.g. "SF1", "SF1:loser", "GA", "BD:1") */
  function resolveParticipant(sideVal, ctx) {
    if (!sideVal) return { name: "TBD", isResolved: false, isPending: true };

    if (typeof sideVal === "object") {
      if (sideVal.ref) {
        var wObj = sideVal.loser ? ctx.losers[sideVal.ref] : ctx.winners[sideVal.ref];
        if (wObj) return { name: wObj, isResolved: true, isPending: false };
        return { name: (sideVal.loser ? "Loser " : "Winner ") + sideVal.ref, isResolved: false, isPending: true };
      }
      if (sideVal.group) {
        var gKey = sideVal.group + (sideVal.rank ? ":" + sideVal.rank : "");
        var gWinner = ctx.groupRanks[gKey] || ctx.groupRanks[sideVal.group];
        if (gWinner) return { name: gWinner, isResolved: true, isPending: false };
        return { name: "Rank " + (sideVal.rank || "1") + " (" + sideVal.group + ")", isResolved: false, isPending: true };
      }
      if (sideVal.name) return { name: sideVal.name, isResolved: true, isPending: false };
    }

    var str = String(sideVal).trim();

    // Check for "MATCH_ID:loser" or "MATCH_ID-loser"
    if (str.indexOf(":loser") !== -1 || str.indexOf("-loser") !== -1) {
      var matchIdL = str.replace(":loser", "").replace("-loser", "");
      if (ctx.losers[matchIdL]) {
        return { name: ctx.losers[matchIdL], isResolved: true, isPending: false };
      }
      return { name: "Loser " + matchIdL, isResolved: false, isPending: true };
    }

    // Check if it's a match ID reference (e.g. "SF1", "QF2", "R1-M1")
    if (ctx.allMatchIds[str]) {
      if (ctx.winners[str]) {
        return { name: ctx.winners[str], isResolved: true, isPending: false };
      }
      return { name: "Winner " + str, isResolved: false, isPending: true };
    }

    // Check if it's a group reference like "GA", "GB", "BD:1", "BD:2"
    if (ctx.groupRanks[str]) {
      return { name: ctx.groupRanks[str], isResolved: true, isPending: false };
    }
    if (str.indexOf(":") !== -1 && ctx.allGroupIds[str.split(":")[0]]) {
      var parts = str.split(":");
      return { name: "Rank " + parts[1] + " (" + parts[0] + ")", isResolved: false, isPending: true };
    }
    if (ctx.allGroupIds[str]) {
      return { name: "Winner " + str, isResolved: false, isPending: true };
    }

    // Default: it's an actual fixed player or team name!
    return { name: str, isResolved: true, isPending: false };
  }

  /* Compute standings for round robin groups */
  function computeStandings(cat, ctx) {
    var standings = {};
    if (!cat.groups) return standings;

    cat.groups.forEach(function(g) {
      var stats = {};
      g.teams.forEach(function(t) {
        stats[t] = { name: t, p: 0, w: 0, l: 0, pf: 0, pa: 0, diff: 0 };
      });

      g.matches.forEach(function(m) {
        var outcome = getMatchOutcome(m);
        if (outcome.hasScores && outcome.winnerSide) {
          var teamA = m.a;
          var teamB = m.b;
          if (stats[teamA] && stats[teamB]) {
            stats[teamA].p++;
            stats[teamB].p++;
            var sA = outcome.sA !== null ? outcome.sA : 0;
            var sB = outcome.sB !== null ? outcome.sB : 0;
            stats[teamA].pf += sA;
            stats[teamA].pa += sB;
            stats[teamB].pf += sB;
            stats[teamB].pa += sA;

            if (outcome.winnerSide === "A") {
              stats[teamA].w++;
              stats[teamB].l++;
            } else if (outcome.winnerSide === "B") {
              stats[teamB].w++;
              stats[teamA].l++;
            }
          }
        }
      });

      // Count remaining unplayed matches per team in this group
      var totalUnplayed = 0;
      g.matches.forEach(function(m) {
        var outcome = getMatchOutcome(m);
        if (!outcome.winnerSide) {
          totalUnplayed++;
          if (stats[m.a]) stats[m.a].rem = (stats[m.a].rem || 0) + 1;
          if (stats[m.b]) stats[m.b].rem = (stats[m.b].rem || 0) + 1;
        }
      });

      var list = g.teams.map(function(t) {
        var s = stats[t];
        s.diff = s.pf - s.pa;
        s.rem = s.rem || 0;
        return s;
      });

      list.sort(function(x, y) {
        return (y.w - x.w) || (y.diff - x.diff) || (y.pf - x.pf);
      });

      standings[g.id] = list;

      // Condition for advancing finalists:
      // A team is ONLY accepted as finalist if:
      // 1) All group matches are completed, OR
      // 2) It is mathematically impossible for another team to overtake them (wins, then point difference)
      if (totalUnplayed === 0) {
        // All matches played -> final standings are 100% locked
        list.forEach(function(item, idx) {
          var rankNum = idx + 1;
          ctx.groupRanks[g.id + ":" + rankNum] = item.name;
          if (rankNum === 1) ctx.groupRanks[g.id] = item.name;
        });
      } else {
        // Can team Y mathematically overtake team X on wins or point difference?
        function canOvertake(y, x) {
          var maxYWins = y.w + (y.rem || 0);
          var minXWins = x.w;
          if (maxYWins > minXWins) return true;
          if (maxYWins === minXWins) {
            var target = cat.targetScore || 15;
            var maxYDiff = y.diff + (y.rem || 0) * target;
            var minXDiff = x.diff - (x.rem || 0) * target;
            if (maxYDiff >= minXDiff) return true;
          }
          return false;
        }

        // Check if Rank 1 is mathematically clinched
        var leader = list[0];
        if (leader && leader.p > 0) {
          var leaderClinched = true;
          for (var i = 1; i < list.length; i++) {
            if (canOvertake(list[i], leader)) {
              leaderClinched = false;
              break;
            }
          }
          if (leaderClinched) {
            ctx.groupRanks[g.id + ":1"] = leader.name;
            ctx.groupRanks[g.id] = leader.name;
          }
        }

        // Check if Rank 2 is mathematically clinched (for groups where top 2 advance)
        if (ctx.groupRanks[g.id + ":1"] && list.length > 1) {
          var second = list[1];
          var secondClinched = true;
          for (var j = 2; j < list.length; j++) {
            if (canOvertake(list[j], second)) {
              secondClinched = false;
              break;
            }
          }
          if (secondClinched) {
            ctx.groupRanks[g.id + ":2"] = second.name;
          }
        }
      }
    });

    return standings;
  }

  /* Compute full tournament state: winners, losers, advanced slots */
  function computeTournamentContext(cat) {
    var ctx = {
      winners: {},
      losers: {},
      groupRanks: {},
      allMatchIds: {},
      allGroupIds: {}
    };

    if (cat.groups) {
      cat.groups.forEach(function(g) {
        ctx.allGroupIds[g.id] = true;
        g.matches.forEach(function(m) { ctx.allMatchIds[m.id] = true; });
      });
      computeStandings(cat, ctx);
    }

    if (cat.rounds) {
      cat.rounds.forEach(function(round) {
        round.matches.forEach(function(m) { ctx.allMatchIds[m.id] = true; });
      });

      cat.rounds.forEach(function(round) {
        round.matches.forEach(function(m) {
          var a = resolveParticipant(m.a, ctx);
          var b = resolveParticipant(m.b, ctx);
          var outcome = getMatchOutcome(m);

          if (outcome.winnerSide === "A" && a.isResolved) {
            ctx.winners[m.id] = a.name;
            ctx.losers[m.id] = b.name;
          } else if (outcome.winnerSide === "B" && b.isResolved) {
            ctx.winners[m.id] = b.name;
            ctx.losers[m.id] = a.name;
          }
        });
      });
    }

    return ctx;
  }

  /* Determine match status: 'live', 'upcoming', 'completed' */
  function getMatchStatus(m, outcome) {
    if (m.status) {
      var s = String(m.status).trim().toLowerCase();
      if (s === "live" || s === "in-progress" || s === "ongoing" || s === "playing") return "live";
      if (s === "completed" || s === "finished" || s === "done") return "completed";
      if (s === "upcoming" || s === "scheduled") return "upcoming";
    }
    if (m.live === true) return "live";
    if (outcome.winnerSide) return "completed";
    return "upcoming";
  }

  function renderStatusBadge(status) {
    if (status === "live") {
      return '<span class="badge-status badge-live"><span class="pulse-dot"></span>Live</span>';
    }
    if (status === "completed") {
      return '<span class="badge-status badge-completed">Completed</span>';
    }
    return '<span class="badge-status badge-upcoming">Upcoming</span>';
  }

  /* Render a knockout match card */
  function renderMatchCard(m, ctx) {
    var a = resolveParticipant(m.a, ctx);
    var b = resolveParticipant(m.b, ctx);
    var outcome = getMatchOutcome(m);
    var status = getMatchStatus(m, outcome);

    var isWinA = outcome.winnerSide === "A";
    var isWinB = outcome.winnerSide === "B";

    var html = '<div class="match match-' + status + '" id="match-' + esc(m.id) + '">';
    html += '<div class="m-id"><span>' + esc(m.id) + '</span>' + renderStatusBadge(status) + '</div>';

    // Side A
    var classA = "side" + (isWinA ? " win" : "") + (a.isPending ? " placeholder" : "");
    html += '<div class="' + classA + '">';
    html += '<div class="nm-wrap"><span class="nm">' + esc(a.name) + '</span></div>';
    if (outcome.scoreLabelA) {
      html += '<span class="score-tag">' + esc(outcome.scoreLabelA) + '</span>';
    }
    html += '<span class="tick"></span>';
    html += '</div>';

    // Side B
    var classB = "side" + (isWinB ? " win" : "") + (b.isPending ? " placeholder" : "");
    html += '<div class="' + classB + '">';
    html += '<div class="nm-wrap"><span class="nm">' + esc(b.name) + '</span></div>';
    if (outcome.scoreLabelB) {
      html += '<span class="score-tag">' + esc(outcome.scoreLabelB) + '</span>';
    }
    html += '<span class="tick"></span>';
    html += '</div>';

    if (m.byeNote) {
      html += '<div class="bye-note">' + esc(m.byeNote) + '</div>';
    }

    html += '</div>';
    return html;
  }

  /* Render rules accordion */
  function renderRulesHTML(id, formatList, generalList) {
    var f = (formatList || []).map(function(x) { return "<li>" + esc(x) + "</li>"; }).join("");
    var g = (generalList || []).map(function(x) { return "<li>" + esc(x) + "</li>"; }).join("");
    return '<details class="rules" id="rules-' + esc(id) + '"><summary>Format &amp; rules</summary><div class="rulebody">' +
      '<div style="font-weight:600;font-size:12.5px;color:var(--muted);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.05em;">Format &amp; scoring</div><ul>' + f + '</ul>' +
      '<div style="font-weight:600;font-size:12.5px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em;">General play</div><ul>' + g + '</ul>' +
      '</div></details>';
  }

  /* Render podium champion strip */
  function renderChampionLine(cat, ctx) {
    if (!cat.rounds || cat.rounds.length === 0) return "";
    var lastRound = cat.rounds[cat.rounds.length - 1];
    var finalMatch = lastRound.matches.filter(function(m) { return /FINAL/i.test(m.id) && !/3RD/i.test(m.id); })[0];
    var thirdMatch = lastRound.matches.filter(function(m) { return /3RD/i.test(m.id); })[0];

    var parts = [];
    if (finalMatch) {
      var w = ctx.winners[finalMatch.id];
      var l = ctx.losers[finalMatch.id];
      parts.push('<span><b>Champion:</b> ' + esc(w || "TBD") + '</span>');
      parts.push('<span><b>Runner-up:</b> ' + esc(l || "TBD") + '</span>');
    }
    if (thirdMatch) {
      var w3 = ctx.winners[thirdMatch.id];
      parts.push('<span><b>3rd place:</b> ' + esc(w3 || "TBD") + '</span>');
    }
    return parts.length ? '<div class="champ-strip">' + parts.join("") + '</div>' : "";
  }

  /* Render a single category view */
  function renderCategoryView(cat) {
    var host = document.getElementById("cat-" + cat.id);
    if (!host) return;

    var ctx = computeTournamentContext(cat);
    var body = host.querySelector(".cat-body");

    var html = "";

    if (cat.type === "roundrobin") {
      var standings = computeStandings(cat, ctx);
      html += '<div class="grp-grid">';
      cat.groups.forEach(function(g) {
        html += '<div class="grp-card"><h3>' + esc(g.name) + ' — teams</h3>';
        g.teams.forEach(function(t, i) {
          html += '<div class="team-row"><span class="n">' + (i + 1) + '</span><span>' + esc(t) + '</span></div>';
        });

        html += '<div class="rr-matches">';
        g.matches.forEach(function(m) {
          var outcome = getMatchOutcome(m);
          var status = getMatchStatus(m, outcome);
          var isWinA = outcome.winnerSide === "A";
          var isWinB = outcome.winnerSide === "B";

          html += '<div class="rr-match match-' + status + '">' +
            '<div style="display:flex;align-items:center;gap:6px;"><span class="rr-id">' + esc(m.id.replace(g.id + "-", "")) + '</span>' + renderStatusBadge(status) + '</div>' +
            '<div style="display:flex;align-items:center;gap:6px;flex:1;min-width:0;">' +
            '<span class="rr-side' + (isWinA ? " win" : "") + '">' + esc(m.a) + '</span>' +
            (outcome.scoreLabelA ? '<span class="score-tag">' + esc(outcome.scoreLabelA) + '</span>' : '') +
            '<span class="vs">v</span>' +
            (outcome.scoreLabelB ? '<span class="score-tag">' + esc(outcome.scoreLabelB) + '</span>' : '') +
            '<span class="rr-side' + (isWinB ? " win" : "") + '">' + esc(m.b) + '</span>' +
            '</div></div>';
        });
        html += '</div>';

        var st = standings[g.id] || [];
        html += '<div style="padding:0 14px 14px;"><table class="standings"><tr><th>Team</th><th>P</th><th>W</th><th>L</th><th>Diff</th></tr>';
        st.forEach(function(s, i) {
          var isTop = (i === 0 && s.w > 0);
          html += '<tr class="' + (isTop ? "rank1" : "") + '"><td>' + esc(s.name) + '</td><td>' + s.p + '</td><td>' + s.w + '</td><td>' + s.l + '</td><td>' + (s.diff > 0 ? "+" : "") + s.diff + '</td></tr>';
        });
        html += '</table></div></div>';
      });
      html += '</div>';

      if (cat.rounds && cat.rounds.length > 0) {
        html += '<div style="margin-top:22px;" class="round-scroll">';
        cat.rounds.forEach(function(round) {
          html += '<div class="round-col"><div class="round-title">' + esc(round.name) + '</div><div class="round-body">';
          round.matches.forEach(function(m) { html += renderMatchCard(m, ctx); });
          html += '</div></div>';
        });
        html += '</div>';
      }
    } else {
      // Knockout
      html += '<div class="round-scroll">';
      cat.rounds.forEach(function(round) {
        html += '<div class="round-col"><div class="round-title">' + esc(round.name) + '</div><div class="round-body">';
        round.matches.forEach(function(m) { html += renderMatchCard(m, ctx); });
        html += '</div></div>';
      });
      html += '</div>';
    }

    body.innerHTML = html;

    var champHost = host.querySelector(".champ-host");
    if (champHost) {
      champHost.innerHTML = renderChampionLine(cat, ctx);
    }

    /* Update category status badge */
    var catMatches = 0, catLive = 0, catCompleted = 0;
    function tallyMatch(m) {
      catMatches++;
      var out = getMatchOutcome(m);
      var st = getMatchStatus(m, out);
      if (st === "live") catLive++;
      else if (st === "completed") catCompleted++;
    }
    if (cat.groups) {
      cat.groups.forEach(function(g) { g.matches.forEach(tallyMatch); });
    }
    if (cat.rounds) {
      cat.rounds.forEach(function(r) { r.matches.forEach(tallyMatch); });
    }

    var catStatusEl = document.getElementById("cat-status-" + cat.id);
    if (catStatusEl) {
      if (catLive > 0) {
        catStatusEl.className = "badge-status badge-live";
        catStatusEl.innerHTML = '<span class="pulse-dot"></span>Live (' + catLive + ')';
      } else if (catCompleted === catMatches && catMatches > 0) {
        catStatusEl.className = "badge-status badge-completed";
        catStatusEl.textContent = "Completed";
      } else if (catCompleted > 0) {
        catStatusEl.className = "badge-status badge-inprogress";
        catStatusEl.textContent = "In Progress (" + catCompleted + "/" + catMatches + ")";
      } else {
        catStatusEl.className = "badge-status badge-upcoming";
        catStatusEl.textContent = "Upcoming";
      }
    }
  }

  /* Fetch all 7 category files with multi-path fallback and cache-busting */
  function fetchCategoryFile(filename) {
    var ts = "?_t=" + Date.now();
    var pathname = window.location.pathname || "/";
    var baseDir = pathname.substring(0, pathname.lastIndexOf("/") + 1);
    if (!baseDir.endsWith("/")) baseDir += "/";

    var pathsToTry = [
      "./data/" + filename + ts,
      baseDir + "data/" + filename + ts,
      "data/" + filename + ts,
      "./" + filename + ts,
      baseDir + filename + ts
    ];

    function tryPath(idx) {
      if (idx >= pathsToTry.length) {
        return Promise.reject(new Error("Cannot load " + filename));
      }
      return fetch(pathsToTry[idx], { cache: "no-store" })
        .then(function(res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .catch(function() {
          return tryPath(idx + 1);
        });
    }

    return tryPath(0);
  }

  function fetchAllCategories(silent) {
    var promises = CATEGORY_FILES.map(function(item) {
      return fetchCategoryFile(item.file)
        .then(function(json) {
          catDataMap[item.id] = json;
        })
        .catch(function(err) {
          console.warn("Could not load " + item.file, err);
        });
    });

    return Promise.all(promises).then(function() {
      var totalMatches = 0, totalLive = 0, totalCompleted = 0;

      CATEGORY_FILES.forEach(function(item) {
        var cat = catDataMap[item.id];
        if (cat) {
          function scan(m) {
            totalMatches++;
            var out = getMatchOutcome(m);
            var st = getMatchStatus(m, out);
            if (st === "live") totalLive++;
            else if (st === "completed") totalCompleted++;
          }
          if (cat.groups) cat.groups.forEach(function(g) { g.matches.forEach(scan); });
          if (cat.rounds) cat.rounds.forEach(function(r) { r.matches.forEach(scan); });

          var titleEl = document.getElementById("title-" + item.id);
          var subEl = document.getElementById("sub-" + item.id);
          var chipEl = document.getElementById("chip-" + item.id);
          var rulesEl = document.getElementById("rules-host-" + item.id);

          if (titleEl) titleEl.textContent = cat.name;
          if (subEl) subEl.textContent = cat.subtitle || "";
          if (chipEl) chipEl.textContent = cat.chip || "";
          if (rulesEl && !rulesEl.hasChildNodes()) {
            var genRules = (cat.type === "roundrobin" || cat.id.indexOf("doubles") !== -1) ? GEN_DOUBLES : GEN_SINGLES;
            rulesEl.innerHTML = renderRulesHTML(cat.id, cat.rulesFormat || [], genRules);
          }
          renderCategoryView(cat);
        }
      });

      var globalBadge = document.getElementById("global-status-badge");
      if (globalBadge) {
        if (totalLive > 0) {
          globalBadge.className = "tourney-status-badge is-live";
          globalBadge.innerHTML = '<span class="pulse-dot"></span>' + totalLive + ' Match' + (totalLive > 1 ? 'es' : '') + ' Live';
        } else if (totalCompleted === totalMatches && totalMatches > 0) {
          globalBadge.className = "tourney-status-badge";
          globalBadge.innerHTML = 'Tournament Completed';
        } else if (totalCompleted > 0) {
          globalBadge.className = "tourney-status-badge";
          globalBadge.innerHTML = 'In Progress (' + totalCompleted + '/' + totalMatches + ' Completed)';
        } else {
          globalBadge.className = "tourney-status-badge";
          globalBadge.innerHTML = 'Upcoming · 20th Sept 2026';
        }
      }
    });
  }

  function showTab(id) {
    activeCatId = id;
    CATEGORY_FILES.forEach(function(item) {
      var catEl = document.getElementById("cat-" + item.id);
      var tabEl = document.getElementById("tabbtn-" + item.id);
      if (catEl) catEl.classList.toggle("active", item.id === id);
      if (tabEl) tabEl.classList.toggle("active", item.id === id);
    });
  }

  /* Initialize DOM */
  function initDOM() {
    var tabsHost = document.getElementById("tabs");
    var catHost = document.getElementById("catHost");

    tabsHost.innerHTML = "";
    catHost.innerHTML = "";

    CATEGORY_FILES.forEach(function(item, i) {
      // Tab button
      var tab = document.createElement("button");
      tab.className = "tab" + (item.id === activeCatId ? " active" : "");
      tab.textContent = item.name;
      tab.id = "tabbtn-" + item.id;
      tab.onclick = function() { showTab(item.id); };
      tabsHost.appendChild(tab);

      // Category Section
      var section = document.createElement("div");
      section.className = "cat" + (item.id === activeCatId ? " active" : "");
      section.id = "cat-" + item.id;
      section.innerHTML =
        '<div class="cat-head">' +
          '<div><h2 id="title-' + esc(item.id) + '">' + esc(item.name) + '</h2>' +
          '<p class="cat-sub" id="sub-' + esc(item.id) + '">Loading data...</p></div>' +
          '<div style="display:flex;align-items:center;gap:8px;">' +
            '<span class="chip" id="chip-' + esc(item.id) + '">Loading...</span>' +
            '<span class="badge-status badge-upcoming" id="cat-status-' + esc(item.id) + '">Upcoming</span>' +
          '</div>' +
        '</div>' +
        '<div class="rules-host" id="rules-host-' + esc(item.id) + '"></div>' +
        '<div class="cat-body" style="padding-top:14px;">Loading fixtures...</div>' +
        '<div class="champ-host"></div>';
      catHost.appendChild(section);
    });

    // Fetch initial data
    fetchAllCategories();

    // Auto-poll every 15 seconds for live venue score commits
    setInterval(function() {
      fetchAllCategories(true);
    }, 15000);
  }

  // Export to window
  window.KSF = {
    showTab: showTab,
    refresh: fetchAllCategories
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initDOM);
  } else {
    initDOM();
  }
})();
</script>
